services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiffin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiffin}
      POSTGRES_DB: ${POSTGRES_DB:-gharse_tiffin}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiffin} -d ${POSTGRES_DB:-gharse_tiffin}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tiffin}:${POSTGRES_PASSWORD:-tiffin}@db:5432/${POSTGRES_DB:-gharse_tiffin}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Relative by default: the browser calls its own origin, so the app works
        # behind localhost, a LAN IP, or an ngrok tunnel without a rebuild.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api/v1}
        # Baked into the /api/* rewrite; must be set at build time.
        BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:8000}
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api/v1}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
